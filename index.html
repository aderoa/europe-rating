<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Rating by Country</title><style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;font:14px/1.45 -apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1a2e}
.wrap{max-width:640px;margin:0 auto;padding:2px}
h2{margin:0 0 8px;font-size:17px;letter-spacing:-.2px}
.pick{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.pick select{font:inherit;padding:4px 6px;border:1px solid #d8d9e3;border-radius:4px;
  background:#fff;color:#1a1a2e;max-width:100%}
svg.map{display:block;width:100%;height:auto;background:#f4f6fa;border-radius:6px}
svg.map.hide{display:none}
.regions{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.regions button{font:inherit;font-size:12px;padding:3px 9px;border:1px solid #d8d9e3;
  border-radius:4px;background:#fff;color:#3a3a52;cursor:pointer}
.regions button.on{background:#8a5a00;border-color:#8a5a00;color:#fff}
svg.map path{stroke:#fff;stroke-width:.7;stroke-linejoin:round}
svg.map .bg{fill:#e6e7ee}
svg.map .off{fill:#d7d9e2}
svg.map .on{cursor:pointer}
svg.map .on:hover{filter:brightness(.88)}
svg.map .sel{stroke:#1a1a2e;stroke-width:1.6}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:#6a6a80;margin:4px 0 10px}
.scale i{display:inline-block;width:90px;height:8px;border-radius:2px;
  background:linear-gradient(90deg,#f1e2bb,#8a5a00)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;margin:0 0 6px}
.tabs button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid #d8d9e3;
  border-radius:14px;background:#fff;color:#3a3a52;cursor:pointer}
.tabs button.on{background:#1a1a2e;border-color:#1a1a2e;color:#fff}
svg.map .grp{stroke:#1a1a2e;stroke-width:1.1;stroke-dasharray:3 2}
h3{margin:0 0 6px;font-size:15px;font-weight:700;padding-bottom:4px;
  border-bottom:2px solid #ecedf3}
h3 small{font-weight:400;color:#6a6a80;font-size:12px}
/* COLUMNS SIZED BY WHAT IS IN THEM (v1.1), as on the All-World page: the name
   on one line, its column as wide as the longest name shown; the team takes
   what is left and wraps onto more lines when it needs to. */
table{border-collapse:collapse;width:100%;table-layout:auto}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
col.c-rk{width:32px}col.c-fl{width:26px}
col.c-age{width:54px}col.c-pos{width:34px}col.c-rat{width:56px}col.c-gp{width:36px}
col.c-wl{width:48px}col.c-num{width:44px}
th,td{padding:5px 5px;border-bottom:1px solid #ecedf3;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;height:29px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#6a6a80;
  text-align:right;border-bottom:1px solid #d8d9e3}
th.l,td.l{text-align:left}
td{text-align:right;font-variant-numeric:tabular-nums}
td.rk{color:#9a9ab0;font-size:12px;overflow:visible}
td.fl{padding-right:0}td.fl img{display:block;width:19px;height:auto;border-radius:2px}
td.pl{font-weight:600;overflow:visible;text-overflow:clip}
/* Status badges after the name (v1.5): NBA experience, or a draft prospect. */
.bd{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.3px;
  line-height:1;padding:2px 4px 2px;border-radius:3px;margin-left:5px;
  vertical-align:2px}
.bd-nba{background:#1d428a;color:#fff}
.bd-logo{background:none;padding:0;vertical-align:-3px}
.bd-logo img{display:block;height:17px;width:auto}
.bd-dr{background:#fff;color:#8a5a00;border:1px solid #c9a24a;padding:1px 4px}
td.tm,td.age,td.pos,td.wl{color:#5a5a72;font-size:12px}
td.pos{text-align:center}
/* The NAME column is exactly as wide as the longest name in the league shown
   (one line, never cut); the TEAM column takes everything left and wraps only
   when even that is not enough. Recomputed for each league, since the table is
   sized by its content. */
td.tm{white-space:normal;overflow:visible;line-height:1.25;width:99%}
td.rat{font-weight:700;color:#8a5a00}
tr:nth-child(even) td{background:#fafafd}
.key{color:#8a8aa0;font-size:11px;margin:8px 0 0}
@media(max-width:560px){
  th,td{padding:5px 2px;font-size:13px}
  col.c-rk{width:26px}col.c-fl{width:22px}col.c-age{width:46px}
  td.tm{min-width:64px}
  col.c-rat{width:46px}col.c-gp{width:26px}
  col.c-reb,col.c-ast{width:0}
  th.x,td.x{display:none}
  col.c-pos{width:26px}col.c-wl{width:38px}
  th{font-size:10px;letter-spacing:.2px}
}
/* On a phone the record goes with rebounds and assists: rating, games and
   points are what fit beside a name and a club. */
@media(max-width:560px){th.x2,td.x2{display:none}}
/* And on the narrowest the position too, rather than a sideways scroll. */
@media(max-width:430px){th.pos,td.pos{display:none}}

    [].forEach.call(document.querySelectorAll('svg.map path[data-c="' + c + '"]'),
                    function(s){ s.parentNode.appendChild(s); });
    sel.value = c;
    cur = c;
    remember(enc(c) + "/" + enc(lg));
  }
  var cur = null;
  tabs.addEventListener("click", function(e){
    var lg = e.target.getAttribute && e.target.getAttribute("data-lg");
    if(lg && curRegion) showRegion(curRegion, lg);
    else if(lg && cur) show(cur, lg);
  });
  sel.addEventListener("change", function(){ if(sel.value) show(sel.value, null, true); });
  maps.forEach(function(m){ m.addEventListener("click", function(e){
    var c = e.target.getAttribute && e.target.getAttribute("data-c");
    if(c && C[c]) show(c);
  }); });
  rbs.forEach(function(b){ b.addEventListener("click", function(){
    var k = b.getAttribute("data-r");
    // Its continental competition first; a map with none falls back to the
    // strongest league on it, unless the country shown is on it.
    if(showRegion(k)) return;
    var m = document.querySelector('svg.map[data-r="' + k + '"]');
    // The World map holds every country: the strongest league on it.
    if(k === "world"){ show(order[0]); return; }
    if(cur && m.querySelector('path[data-c="' + cur + '"]')) return;
    for(var i = 0; i < order.length; i++)
      if(HOME[order[i]] === k){ show(order[i]); return; }
  }); });
  var saved = null;
  try { saved = sessionStorage.getItem("gr-map-view"); } catch(e) {}
  // A link pasted into a tab already showing the page changes only the hash.
  window.addEventListener("hashchange", function(){ restore(location.hash.slice(1)); });
  if(restore((location.hash || "").slice(1)) || restore(saved)) {}
  else if(!showRegion("europe")){
    var first = order.filter(function(c){ return HOME[c] === "europe"; })[0] || order[0];
    show(first);
  }
})();
</script></body></html>
